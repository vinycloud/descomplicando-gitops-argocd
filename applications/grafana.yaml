apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-app
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 7.0.19
    helm:
      valueFiles:
      - $values/grafana/values.yaml
  - repoURL: 'https://github.com/vinycloud/descomplicando-gitops-argocd.git'
    targetRevision: feat/argocd
    ref: values
  syncPolicy:
    automated: 
      selfHeal: true
    syncOptions:
      - CreateNamespace=true